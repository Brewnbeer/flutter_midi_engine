name: flutter_midi_engine
description: MIDI synthesizer plugin for Flutter. Play MIDI notes with built-in General MIDI sounds or SF2 soundfonts on Android, iOS, macOS and the web.
version: 0.3.0
homepage: https://github.com/Brewnbeer/flutter_midi_engine
repository: https://github.com/Brewnbeer/flutter_midi_engine
issue_tracker: https://github.com/Brewnbeer/flutter_midi_engine/issues
documentation: https://github.com/Brewnbeer/flutter_midi_engine#readme

environment:
  sdk: ^3.14.0
  flutter: ">=3.50.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  plugin_platform_interface: ^2.1.8
  path_provider: ^2.1.5
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  plugin:
    platforms:
      android:
        package: com.midiengine.flutter_midi_engine
        pluginClass: FlutterMidiEnginePlugin
      ios:
        pluginClass: FlutterMidiEnginePlugin
      macos:
        pluginClass: FlutterMidiEnginePlugin
      web:
        pluginClass: FlutterMidiEngineWeb
        fileName: flutter_midi_engine_web.dart

  # Web-only assets: the SpessaSynth synthesizer (see tool/build_web_synth.sh)
  # and the built-in soundfont. They are not added to Android, iOS or macOS apps.
  assets:
    - path: assets/web/spessasynth_lib.min.js
      platforms: [web]
    - path: assets/web/spessasynth_processor.min.js
      platforms: [web]
    - path: ios/flutter_midi_engine/Sources/flutter_midi_engine/Resources/flutter_midi_engine_basic.sf2
      platforms: [web]

  # To add assets to your package, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg
  #
  # For details regarding assets in packages, see
  # https://flutter.dev/to/asset-from-package
  #
  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # To add custom fonts to your package, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts in packages, see
  # https://flutter.dev/to/font-from-package
